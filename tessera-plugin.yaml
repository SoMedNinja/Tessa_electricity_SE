# Tessa electricity SE: the price of power now as a tile, and the graph of today and tomorrow on bigger tiles and on a
# card. Delivery tax and costs, and optional sales sensor and cost, are configured per tile. The price now of a tile
# can also stand in the top bar.
id: tessa_electricity_se
version: 0.1.2
api: "0.15"
icon: flash
maintainer: SoMedNinja
license: MIT
stage: beta
topics: [energy]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 16

# The price now of a tile on the screen, with that tile's sensor, formula and unit.
bar_items:
  - { id: price, label: bar_price, icon: flash, example: bar_example }

tiles:
# One tile per integration; sensor selection is per tile and price-list parsing remains integration-specific.
  - id: nordpool
    name: tile_name_nordpool
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 16000
    domains: [sensor]
    attributes: [unit_of_measurement]
    fields:
      today: { path: "raw_today[*].value", as: numbers }
      tomorrow: { path: "raw_tomorrow[*].value", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: tax, kind: number, min: 0, max: 100, step: 0.1, default: 0, unit: "%", label: tax, hint: tax_hint }
      - { id: delivery_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: delivery_additional, hint: delivery_additional_hint }
      - { id: sales_entity, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: sales_entity, hint: sales_entity_hint }
      - { id: sales_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: sales_additional, hint: sales_additional_hint }
      - id: graph
        kind: choice
        default: bars
        label: graph
        hint: graph_hint
        choices:
          - { value: bars, label: graph_bars }
          - { value: line, label: graph_line }
      - { id: fill, kind: toggle, default: true, label: fill, hint: fill_hint }
      - id: grid
        kind: choice
        default: none
        label: grid
        hint: grid_hint
        choices:
          - { value: none, label: grid_none }
          - { value: solid, label: grid_solid }
          - { value: dotted, label: grid_dotted }
      - { id: ahead, kind: toggle, default: false, label: ahead, hint: ahead_hint }
  - id: entsoe
    name: tile_name_entsoe
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 16000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [prices_today]
    fields:
      today: { path: "prices_today[*].price", as: numbers }
      tomorrow: { path: "prices_tomorrow[*].price", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: tax, kind: number, min: 0, max: 100, step: 0.1, default: 0, unit: "%", label: tax, hint: tax_hint }
      - { id: delivery_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: delivery_additional, hint: delivery_additional_hint }
      - { id: sales_entity, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: sales_entity, hint: sales_entity_hint }
      - { id: sales_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: sales_additional, hint: sales_additional_hint }
      - id: graph
        kind: choice
        default: bars
        label: graph
        hint: graph_hint
        choices:
          - { value: bars, label: graph_bars }
          - { value: line, label: graph_line }
      - { id: fill, kind: toggle, default: true, label: fill, hint: fill_hint }
      - id: grid
        kind: choice
        default: none
        label: grid
        hint: grid_hint
        choices:
          - { value: none, label: grid_none }
          - { value: solid, label: grid_solid }
          - { value: dotted, label: grid_dotted }
      - { id: ahead, kind: toggle, default: false, label: ahead, hint: ahead_hint }
  - id: gespot
    name: tile_name_gespot
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 16000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [today_interval_prices]
    fields:
      today: { path: "today_interval_prices[*].value", as: numbers }
      tomorrow: { path: "tomorrow_interval_prices[*].value", as: numbers }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: tax, kind: number, min: 0, max: 100, step: 0.1, default: 0, unit: "%", label: tax, hint: tax_hint }
      - { id: delivery_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: delivery_additional, hint: delivery_additional_hint }
      - { id: sales_entity, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: sales_entity, hint: sales_entity_hint }
      - { id: sales_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: sales_additional, hint: sales_additional_hint }
      - id: graph
        kind: choice
        default: bars
        label: graph
        hint: graph_hint
        choices:
          - { value: bars, label: graph_bars }
          - { value: line, label: graph_line }
      - { id: fill, kind: toggle, default: true, label: fill, hint: fill_hint }
      - id: grid
        kind: choice
        default: none
        label: grid
        hint: grid_hint
        choices:
          - { value: none, label: grid_none }
          - { value: solid, label: grid_solid }
          - { value: dotted, label: grid_dotted }
      - { id: ahead, kind: toggle, default: false, label: ahead, hint: ahead_hint }
  - id: epex
    name: tile_name_epex
    icon: flash
    sizes: { min: 1x1, max: 9x9, full: true }
    memory: 16000
    domains: [sensor]
    attributes: [unit_of_measurement]
    has_attributes: [data]
    # One list of yesterday, today and tomorrow: the screen cuts the days out of it by the start of the first two slots.
    fields:
      prices: { path: "data[*].price_per_kwh", as: numbers }
      first: { path: "data[0].start_time", as: epoch }
      second: { path: "data[1].start_time", as: epoch }
    example: tile_example
    preview: { title: "{name}", value: "{state} {unit_of_measurement}" }
    options:
      - id: unit
        kind: choice
        default: eur
        label: unit
        hint: unit_hint
        choices:
          - { value: eur, label: unit_eur }
          - { value: cents, label: unit_cents }
      - { id: fixed, kind: number, min: 0, max: 4, step: 1, default: 3, label: decimals, hint: decimals_hint }
      - { id: tax, kind: number, min: 0, max: 100, step: 0.1, default: 0, unit: "%", label: tax, hint: tax_hint }
      - { id: delivery_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: delivery_additional, hint: delivery_additional_hint }
      - { id: sales_entity, kind: entity, domains: [sensor], attributes: [unit_of_measurement], label: sales_entity, hint: sales_entity_hint }
      - { id: sales_additional, kind: number, min: -100, max: 100, step: 0.001, default: 0, label: sales_additional, hint: sales_additional_hint }
      - id: graph
        kind: choice
        default: bars
        label: graph
        hint: graph_hint
        choices:
          - { value: bars, label: graph_bars }
          - { value: line, label: graph_line }
      - { id: fill, kind: toggle, default: true, label: fill, hint: fill_hint }
      - id: grid
        kind: choice
        default: none
        label: grid
        hint: grid_hint
        choices:
          - { value: none, label: grid_none }
          - { value: solid, label: grid_solid }
          - { value: dotted, label: grid_dotted }
      - { id: ahead, kind: toggle, default: false, label: ahead, hint: ahead_hint }

cards:
  - { id: prices, name: card_name, wide: true }

