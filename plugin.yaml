# What a screen gets when it takes this plugin: the component. Tessera includes this file from the screen's
# <name>.plugins.yaml and adds this plugin's components/ folder as an ESPHome external component. The tiles get their
# sensors from the editor, and the top bar's item shows the price of a tile.
defaults:
  NORDPOOL_CONFIG_ENTRY: ""
tessa_electricity_se:
  nordpool_config_entry: ${NORDPOOL_CONFIG_ENTRY}

